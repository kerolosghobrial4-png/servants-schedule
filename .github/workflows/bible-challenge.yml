name: Bible Challenge CI

on:
  push:
    paths: ["bible-challenge/**", ".github/workflows/bible-challenge.yml"]
  pull_request:
    paths: ["bible-challenge/**", ".github/workflows/bible-challenge.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bible-challenge
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bible
          POSTGRES_PASSWORD: bible
          POSTGRES_DB: bible_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bible" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bible:bible@localhost:5432/bible_test
      DATABASE_URL: postgres://bible:bible@localhost:5432/bible_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bible-challenge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: bible-challenge
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bible
          POSTGRES_PASSWORD: bible
          POSTGRES_DB: bible_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bible" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://bible:bible@localhost:5432/bible_e2e
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password-123
      E2E_ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bible-challenge/package-lock.json
      - run: npm ci
      - run: npm run db:migrate && npm run db:seed && npm run db:seed:demo
      - run: npm run build
      - name: Start the production server
        run: |
          COOKIE_SECURE=false NODE_ENV=production nohup npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && exit 0; sleep 2; done
          cat server.log; exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: bible-challenge/test-results/
