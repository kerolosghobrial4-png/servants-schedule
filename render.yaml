# Render Blueprint for the Bible Challenge app (bible-challenge/).
# In Render: New → Blueprint → pick this repository. Then run the seed once
# from the web service's Shell tab:
#   ADMIN_USERNAME=admin ADMIN_PASSWORD='a long password' npm run db:seed
services:
  - type: web
    name: bible-challenge
    runtime: node
    rootDir: bible-challenge
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bible-challenge-db
          property: connectionString
      - key: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: bible-challenge-db
    plan: basic-256mb
    databaseName: bible_challenge
    postgresMajorVersion: "16"
