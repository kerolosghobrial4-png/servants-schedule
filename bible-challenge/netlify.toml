# Netlify deployment of the Bible Challenge app (this folder is the site root).
# Netlify Database provides NETLIFY_DB_URL and applies netlify/database/migrations
# before each deploy is published. Set these environment variables on the site:
#   NEXT_SERVER_ACTIONS_ENCRYPTION_KEY  (openssl rand -base64 32)
#   TRUST_PROXY=true
#   BOOTSTRAP_ON_START=true, ADMIN_USERNAME, ADMIN_PASSWORD  (creates the first admin)
#   SEED_DEMO_DATA=true                 (demo sites only)
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
