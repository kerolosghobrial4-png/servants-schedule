<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css?v=70c345dd">
  <style>

    .lesson-link-btn:hover{background:#2563eb;}
    .lesson-link-btn .link-icon{font-size:16px;line-height:1;}
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Content rendered by JavaScript based on which servant is selected -->
  </div>

  <script>
    // ============================================
    // WEEK DATA - Generated by schedule_generator.html

    const SERVANTS = {
      "abanoub-nagdy": { name: "Abanoub Nagdy", group: "5th & 6th Boys" },
      "kerolos-soliman": { name: "Kerolos Soliman", group: "5th & 6th Boys" },
      "jouvany-ghobrial": { name: "Jouvany Ghobrial", group: "5th & 6th Boys" },
      "divid-romany": { name: "Divid Romany", group: "5th & 6th Boys" },
      "romany-ghobrial": { name: "Romany Ghobrial", group: "5th & 6th Boys" },
      "marsilio-nagi": { name: "Marsilio Nagi", group: "7th & 8th" },
      "abanoub-hanna": { name: "Abanoub Hanna", group: "7th & 8th" },
      "mark-william": { name: "Mark William", group: "7th & 8th" },
      "poula-khalil": { name: "Poula Khalil", group: "7th & 8th" }
    };

    const TASKS = {
      "abanoub-nagdy": {
        classGroup: "5th & 6th Boys",
        duties: [
          "🎵 Lead the hymn / hazzat",
          "🎤 Handle the class recordings"
        ],
        lessonLinks: [
          { label: "Kiahk Hiten", url: "https://www.stgeorgecocnashville.org/deaconsSchool/hymn?id=122&returnUrl=%2FdeaconsSchool%2Fcalendar" }
        ],
        warning: { type: "hymn", text: "DO NOT FORGET to send hazzat and recording by Thursday, October 29, 2026." },
        note: "alright new hymn bbg\n\nsend the hazzat and you saying it by friday!"
      },
      "kerolos-soliman": {
        classGroup: "5th & 6th Boys",
        backup: true,
        duties: [
          "📝 Take attendance",
          "🪑 Sit with the class"
        ],
        note: "we need u with the kids this week\n\nalso dont forget attendance"
      },
      "jouvany-ghobrial": {
        classGroup: "5th & 6th Boys",
        duties: [
          "🎵 Lead the hymn / hazzat"
        ],
        lessonLinks: [
          { label: "Kiahk Hiten", url: "https://www.stgeorgecocnashville.org/deaconsSchool/hymn?id=122&returnUrl=%2FdeaconsSchool%2Fcalendar" }
        ],
        warning: { type: "hymn", text: "DO NOT FORGET to send hazzat and recording by Thursday, October 29, 2026." },
        note: "wussup loser\n\nsend the hazzat and you saying it by friday!"
      },
      "divid-romany": {
        classGroup: "5th & 6th Boys",
        backup: true,
        duties: [
          "🪑 Sit with the class",
          "📝 Take attendance"
        ],
        note: "u still alive??\n\nu got attendance this week"
      },
      "romany-ghobrial": {
        classGroup: "5th & 6th Boys",
        duties: [
          "✝️ Lead the rituals lesson"
        ],
        note: "make sure all the 5/6 attendance is taken\n\ngo to each clas smake sure theyre alive and on the same pace as the other"
      },
      "marsilio-nagi": {
        classGroup: "7th & 8th",
        backup: true,
        duties: [
          "🪑 Sit with the class",
          "📝 Take attendance"
        ],
        note: "u better be there this week\n\nwe need u with the kids"
      },
      "abanoub-hanna": {
        classGroup: "7th & 8th",
        duties: [
          "📝 Take attendance",
          "🪑 Sit with the class"
        ],
        note: "great job last week\n\nsit wiht the kids make sure they are under controll and dont forget attendance"
      },
      "mark-william": {
        classGroup: "7th & 8th",
        duties: [
          "🎵 Lead the hymn / hazzat",
          "🎤 Handle the class recordings"
        ],
        lessonLinks: [
          { label: "kiahk Psalm 150 w/o Aleluia", url: "https://www.stgeorgecocnashville.org/deaconsSchool/hymn?id=150&returnUrl=%2FdeaconsSchool%2Fcalendar" }
        ],
        warning: { type: "hymn", text: "DO NOT FORGET to send hazzat and recording by Thursday, October 29, 2026." },
        note: "wussup mark\n\nsend hazzat and recording of u saying it by friday"
      },
      "poula-khalil": {
        classGroup: "7th & 8th",
        backup: true,
        duties: [
          "🪑 Sit with the kids and keep them in check",
          "📝 Take attendance"
        ],
        note: "u better be there this week too\n\nsit with the kids make sure they are under controll"
      }
    };

    const ANNOUNCEMENTS = [
      "no tasbeha this week",
      "we will start our second to last hymn this week",
      "no rituals either"
    ];

    function announcementsHtml() {
      const items = ANNOUNCEMENTS.length
        ? ANNOUNCEMENTS.map(a => `<li>${a}</li>`).join("")
        : `<li class="announcement-empty">No announcements this week.</li>`;
      return `<section class="announcements" style="text-align:left;"><h2>📢 Announcements</h2><ul class="announcement-list">${items}</ul></section>`;
    }

    const params = new URLSearchParams(window.location.search);
    const servantId = params.get("servant");
    const app = document.getElementById("app");

    function renderNameList() {
      let html = `
        <header>
          <h1>🛡️ Servants Lesson Plan</h1>
          <div class="task-date">${WEEK_DATE}</div>
          <p class="subtitle">Select your name to view your task</p>
        </header>
      `;

      html += `<div class="home-columns">`;
      html += `<div class="group group-left"><h2>👦 5th &amp; 6th Boys</h2><div class="name-grid">`;
      ["abanoub-nagdy","kerolos-soliman","jouvany-ghobrial","divid-romany","romany-ghobrial"].forEach(id => {
        const s = SERVANTS[id];
        html += `<a href="?servant=${id}" class="name-card">${s.name}</a>`;
      });
      html += `</div></div>`;

      html += announcementsHtml();

      html += `<div class="group group-right"><h2>👦 7th &amp; 8th</h2><div class="name-grid">`;
      ["marsilio-nagi","abanoub-hanna","mark-william","poula-khalil"].forEach(id => {
        const s = SERVANTS[id];
        html += `<a href="?servant=${id}" class="name-card">${s.name}</a>`;
      });
      html += `</div></div>`;
      html += `</div>`;

      html += `<footer><p>For questions, contact your coordinator.</p></footer>`;
      app.className = "container container-wide";
      app.innerHTML = html;
    }

    function linkIcon(url){
      var u=(url||"").toLowerCase();
      if(u.indexOf("youtube.com")>=0||u.indexOf("youtu.be")>=0) return "\u25b6\ufe0f";
      if(u.indexOf(".pdf")>=0) return "\ud83d\udcc4";
      if(u.indexOf("netlify.app")>=0||u.indexOf("game")>=0||u.indexOf("play")>=0) return "\ud83c\udfae";
      return "\ud83d\udd17";
    }
    function startsWithEmoji(s){
      if(!s||!s.length)return false;
      var c=s.codePointAt(0);
      return c>=0x2500;
    }
    function renderTask(servantId) {
      const servant = SERVANTS[servantId];
      if (!servant) { renderNameList(); return; }
      const task = TASKS[servantId];
      let taskHtml;
      if (task) {
        taskHtml = `
          <div class="duty-list">
            <div class="duty-list-label">Class: ${task.classGroup}</div>
            <div class="duty-list-label" style="margin-top:4px;">Your Responsibilities This Week</div>
            <ul class="duty-ul">
              ${task.duties.map(function(d) { return `<li class="duty-item">${d}</li>`; }).join('')}
            </ul>
          </div>
          ${task.lessonLinks && task.lessonLinks.length > 0 ? `
            <div style="margin-top:8px;">
              ${task.lessonLinks.map(function(l) { var ic=linkIcon(l.url); var se=startsWithEmoji(l.label); return `<a href="${l.url}" target="_blank" rel="noopener" class="lesson-link-btn">${se?"":`<span class="link-icon">${ic}</span> `}${l.label}</a>`; }).join('')}
            </div>
          ` : ''}
          ${task.warning ? `
            <div class="warning-box warning-${task.warning.type}">
              <div class="warning-icon">${task.warning.type === 'hymn' ? '⚠️' : (task.warning.type === 'game' ? '🎮' : '📖')}</div>
              <div class="warning-text">${task.warning.text}</div>
            </div>
          ` : ''}
        `;
      } else {
        taskHtml = `<div class="no-task">No task has been assigned to you for this week yet. 🙏</div>`;
      }
      app.className = "container";
      app.innerHTML = `
        <div class="task-view">
          ${task && task.backup ? '' : `<div class="task-date">${WEEK_DATE}</div>`}
          <div class="servant-name-display">${servant.name}</div>
          <div class="servant-group-label">${servant.group}</div>
          ${taskHtml}
          <br>
          ${task && task.note ? `
            <div style="margin:18px 0 14px;padding:14px 16px;border:1px solid #c3dafe;border-left:4px solid #3b82f6;background:#ebf4ff;border-radius:8px;">
              <div style="font-size:13px;font-weight:700;color:#1e40af;letter-spacing:.02em;margin-bottom:6px;">📋 Note from coordinator</div>
              <div style="font-size:15px;line-height:1.5;color:#1e3a5f;white-space:pre-wrap;">${task.note}</div>
            </div>
          ` : ''}
          ${ANNOUNCEMENTS.length ? `<div style="margin-top:18px;">${announcementsHtml()}</div>` : ''}
          <a href="index.html" class="back-link">&larr; Back to all weeks</a>
        </div>
      `;
    }

    if (servantId && SERVANTS[servantId]) { renderTask(servantId); }
    else { renderNameList(); }
  </script>
</body>
</html>
