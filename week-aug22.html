<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week of August 22 - Servants Lesson Plan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="app">
    <!-- Content rendered by JavaScript based on which servant is selected -->
  </div>

  <script>
    // ============================================
    // WEEK DATA - Edit this section each week
    // ============================================
    const WEEK_DATE = "August 22, 2026";

    // List of all servants with their class groups
    const SERVANTS = {
      "abanoub-nagdy":     { name: "Abanoub Nagdy",    group: "5th & 6th Boys" },
      "kerolos-soliman":   { name: "Kerolos Soliman",  group: "5th & 6th Boys" },
      "jouvany-ghobrial":  { name: "Jouvany Ghobrial", group: "5th & 6th Boys" },
      "divid-romany":      { name: "Divid Romany",     group: "5th & 6th Boys" },
      "marsilio-nagi":     { name: "Marsilio Nagi",    group: "7th & 8th" },
      "abanoub-hanna":     { name: "Abanoub Hanna",   group: "7th & 8th" },
      "mark-william":      { name: "Mark William",     group: "7th & 8th" },
      "poula-khalil":      { name: "Poula Khalil",     group: "7th & 8th" }
    };

    // Tasks for this week. Add entries as servants are assigned.
    // task: the description, classGroup: which class, lessonLink: URL to lesson materials
    const TASKS = {
      "abanoub-nagdy": {
        classGroup: "5th & 6th Boys",
        duties: [
          "🎮 Lead the Ritual Lesson Review Game (Lesson 1: Thanksgiving Prayer & Verses of Cymbals)",
          "📖 Read ONLY pages 4 and 5 (Lesson 1) — the rest of the PDF is for other lessons"
        ],
        lessonLinks: [
          { label: "🎮 Play Review Game", url: "https://tourmaline-strudel-f6fd09.netlify.app" }
        ],
        warning: { type: "game", text: "Reminder: Send which games you plan to use so everyone is prepared." }
      },
      "kerolos-soliman": {
        classGroup: "5th & 6th Boys",
        duties: [
          "🪑 Sit with the kids and keep them in check",
          "📝 Take attendance",
          "📊 Keep up with points for the week (in class)",
          "🎙️ Prepare Amen Keryalaison as backup (in case Jouvany is absent)"
        ],
        lessonLinks: [
          { label: "▶️ Backup: YouTube Video", url: "https://www.youtube.com/watch?v=qADr2AZ0Mis" },
          { label: "📄 Backup: PDF Sheet Music", url: "https://oplzcugljytvywvewdkj.supabase.co/storage/v1/object/public/deacons_school_hymns_files/amenKErie.pdf?t=2024-07-09T03%3A18%3A07.448Z" }
        ]
      },
      "jouvany-ghobrial": {
        classGroup: "5th & 6th Boys",
        duties: [
          "🎯 Finish the whole hymn — Amen Keryalaison (Vespers), all parts",
          "🎤 Handle the class recordings"
        ],
        lessonLinks: [
          { label: "▶️ YouTube Video", url: "https://www.youtube.com/watch?v=qADr2AZ0Mis" },
          { label: "📄 PDF Sheet Music", url: "https://oplzcugljytvywvewdkj.supabase.co/storage/v1/object/public/deacons_school_hymns_files/amenKErie.pdf?t=2024-07-09T03%3A18%3A07.448Z" }
        ],
        warning: { type: "hymn", text: "DO NOT FORGET to send hazzat and recording by Thursday, August 20, 2026." }
      },
      "divid-romany": {
        classGroup: "5th & 6th Boys",
        duties: [
          "🪑 Sit with the kids",
          "🎮 Prepare the Ritual Lesson Review Game as backup (in case Abanoub is absent)"
        ],
        lessonLinks: [
          { label: "🎮 Backup: Play Review Game", url: "https://tourmaline-strudel-f6fd09.netlify.app" }
        ],
        warning: { type: "game", text: "Reminder: Send which games you plan to use so everyone is prepared." }
      },
      "mark-william": {
        classGroup: "7th & 8th",
        duties: [
          "🪑 Sit with the kids",
          "📝 Take attendance",
          "📊 Keep up with points for the week (in class)",
          "🎙️ Prepare First Hoos Lobsh as backup (in case Poula is absent)"
        ],
        lessonLinks: [
          { label: "▶️ Backup: YouTube Video", url: "https://www.youtube.com/watch?v=K5n8nCnREr0" },
          { label: "🌐 Backup: Hymn Page", url: "https://www.stgeorgecocnashville.org/deaconsSchool/hymn?id=145&returnUrl=%2Fcalendar" }
        ]
      },
      "abanoub-hanna": {
        classGroup: "7th & 8th",
        duties: [
          "🎮 Lead the Ritual Lesson Review Game (Lesson One: Liturgy of the Believers)"
        ],
        lessonLinks: [
          { label: "🎮 Play Review Game", url: "https://level9-intro.netlify.app" }
        ],
        warning: { type: "game", text: "Reminder: Send which games you plan to use so everyone is prepared." }
      },
      "poula-khalil": {
        classGroup: "7th & 8th",
        duties: [
          "🎯 Finish the whole hymn — First Hoos Lobsh, all parts",
          "🎤 Handle the class recordings"
        ],
        lessonLinks: [
          { label: "▶️ YouTube Video", url: "https://www.youtube.com/watch?v=K5n8nCnREr0" },
          { label: "🌐 Hymn Page", url: "https://www.stgeorgecocnashville.org/deaconsSchool/hymn?id=145&returnUrl=%2Fcalendar" }
        ],
        warning: { type: "hymn", text: "DO NOT FORGET to send hazzat and recording by Thursday, August 20, 2026." }
      },
      "marsilio-nagi": {
        classGroup: "7th & 8th",
        duties: [
          "🪑 Sit with the kids",
          "🎮 Prepare the Ritual Lesson Review Game as backup (in case Abanoub is absent)"
        ],
        lessonLinks: [
          { label: "🎮 Backup: Play Review Game", url: "https://level9-intro.netlify.app" }
        ],
        warning: { type: "game", text: "Reminder: Send which games you plan to use so everyone is prepared." }
      }
      // Add more tasks here as assignments are made:
      // "kerolos-soliman": { task: "...", classGroup: "...", lessonLink: "..." },
    };
    // ============================================

    // Get the servant ID from the URL (e.g. week-aug15.html?servant=jouvany-ghobrial)
    const params = new URLSearchParams(window.location.search);
    const servantId = params.get("servant");
    const app = document.getElementById("app");

    function renderNameList() {
      let html = `
        <header>
          <h1>🛡️ Servants Lesson Plan</h1>
          <div class="task-date">${WEEK_DATE}</div>
          <p class="subtitle">Select your name to view your task</p>
        </header>
      `;

      // 5th & 6th Boys
      html += `<div class="group"><h2>👦 5th &amp; 6th Boys</h2><div class="name-grid">`;
      ["abanoub-nagdy", "kerolos-soliman", "jouvany-ghobrial", "divid-romany"].forEach(id => {
        const s = SERVANTS[id];
        html += `<a href="?servant=${id}" class="name-card">${s.name}</a>`;
      });
      html += `</div></div>`;

      // 7th & 8th
      html += `<div class="group"><h2>👦 7th &amp; 8th</h2><div class="name-grid">`;
      ["marsilio-nagi", "abanoub-hanna", "mark-william", "poula-khalil"].forEach(id => {
        const s = SERVANTS[id];
        html += `<a href="?servant=${id}" class="name-card">${s.name}</a>`;
      });
      html += `</div></div>`;

      html += `<footer><p>For questions, contact your coordinator.</p></footer>`;
      app.innerHTML = html;
    }

    function renderTask(servantId) {
      const servant = SERVANTS[servantId];
      if (!servant) {
        renderNameList();
        return;
      }

      const task = TASKS[servantId];

      let taskHtml;
      if (task) {
        taskHtml = `
          <div class="duty-list">
            <div class="duty-list-label">Class: ${task.classGroup}</div>
            <div class="duty-list-label" style="margin-top:4px;">Your Responsibilities This Week</div>
            <ul class="duty-ul">
              ${task.duties.map(function(d) { return `<li class="duty-item">${d}</li>`; }).join('')}
            </ul>
          </div>
          ${task.lessonLinks && task.lessonLinks.length > 0 ? `
            <div style="margin-top:8px;">
              ${task.lessonLinks.map(function(l) { return `<a href="${l.url}" target="_blank" rel="noopener" class="lesson-link-btn" style="margin:6px 6px 0 0;">${l.label}</a>`; }).join('')}
            </div>
          ` : ''}
          ${task.lessonLink ? `
            <a href="${task.lessonLink}" target="_blank" rel="noopener" class="lesson-link-btn">
              📖 Open Lesson Materials
            </a>
          ` : ''}
          ${task.warning ? `
            <div class="warning-box warning-${task.warning.type}">
              <div class="warning-icon">${task.warning.type === 'hymn' ? '⚠️' : (task.warning.type === 'game' ? '🎮' : '📖')}</div>
              <div class="warning-text">${task.warning.text}</div>
            </div>
          ` : ''}
        `;
      } else {
        taskHtml = `
          <div class="no-task">
            No task has been assigned to you for this week yet. 🙏
          </div>
        `;
      }

      app.innerHTML = `
        <div class="task-view">
          <div class="task-date">${WEEK_DATE}</div>
          <div class="servant-name-display">${servant.name}</div>
          <div class="servant-group-label">${servant.group}</div>
          ${taskHtml}
          <br>
          <a href="index.html" class="back-link">&larr; Back to all weeks</a>
        </div>
      `;
    }

    // Render the appropriate view
    if (servantId && SERVANTS[servantId]) {
      renderTask(servantId);
    } else {
      renderNameList();
    }
  </script>
</body>
</html>
