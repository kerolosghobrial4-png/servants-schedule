<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week of August 22 - Servants Lesson Plan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="app">
    <!-- Content rendered by JavaScript based on which servant is selected -->
  </div>

  <script>
    // ============================================
    // WEEK DATA - Edit this section each week
    // ============================================
    const WEEK_DATE = "August 22, 2026";

    // List of all servants with their class groups
    const SERVANTS = {
      "abanoub-nagdy":     { name: "Abanoub Nagdy",    group: "5th & 6th Boys" },
      "kerolos-soliman":   { name: "Kerolos Soliman",  group: "5th & 6th Boys" },
      "jouvany-ghobrial":  { name: "Jouvany Ghobrial", group: "5th & 6th Boys" },
      "divid-romany":      { name: "Divid Romany",     group: "5th & 6th Boys" },
      "marsilio-nagi":     { name: "Marsilio Nagi",    group: "7th & 8th" },
      "abanoub-hanna":     { name: "Abanoub Hanna",   group: "7th & 8th" },
      "mark-william":      { name: "Mark William",     group: "7th & 8th" },
      "poula-khalil":      { name: "Poula Khalil",     group: "7th & 8th" }
    };

    // Tasks for this week. Add entries as servants are assigned.
    // task: the description, classGroup: which class, lessonLink: URL to lesson materials
    const TASKS = {
      "abanoub-nagdy": {
        task: "Ritual Lesson Review Game — Lesson 1: The Thanksgiving Prayer and Verses of Cymbals",
        classGroup: "5th & 6th Boys",
        lessonLinks: [
          { label: "📄 Open Lesson PDF", url: "https://oplzcugljytvywvewdkj.supabase.co/storage/v1/object/public/deacons_school_rituals_files/Level%207%20Rituals.pdf?t=2024-07-24T20%3A20%3A30.002Z" }
        ],
        note: "📖 Read ONLY pages 4 and 5 (Lesson 1). The rest of the PDF is for other lessons."
      },
      "kerolos-soliman": {
        task: "Be with the kids, take attendance, and prepare Jouvany's task (Amen Keryalaison) in case Jouvany can't make it.",
        classGroup: "5th & 6th Boys",
        lessonLinks: [
          { label: "▶️ Backup: YouTube Video", url: "https://www.youtube.com/watch?v=qADr2AZ0Mis" },
          { label: "📄 Backup: PDF Sheet Music", url: "https://oplzcugljytvywvewdkj.supabase.co/storage/v1/object/public/deacons_school_hymns_files/amenKErie.pdf?t=2024-07-09T03%3A18%3A07.448Z" }
        ],
        note: "🪑 Your main role is being with the kids and taking attendance. Prepare Jouvany's hymn (links below) in case he is absent."
      },
      "jouvany-ghobrial": {
        task: "Finish Amen Keryalaison (Vespers)",
        classGroup: "5th & 6th Boys",
        lessonLinks: [
          { label: "▶️ YouTube Video", url: "https://www.youtube.com/watch?v=qADr2AZ0Mis" },
          { label: "📄 PDF Sheet Music", url: "https://oplzcugljytvywvewdkj.supabase.co/storage/v1/object/public/deacons_school_hymns_files/amenKErie.pdf?t=2024-07-09T03%3A18%3A07.448Z" }
        ],
        note: "🎯 Finish the whole hymn — all parts. You have this week to complete it."
      },
      "divid-romany": {
        task: "Sit with the kids and prepare the ritual lesson review game (Lesson 1) as backup (in case Abanoub can't make it).",
        classGroup: "5th & 6th Boys",
        lessonLinks: [
          { label: "📄 Backup: Open Lesson PDF", url: "https://oplzcugljytvywvewdkj.supabase.co/storage/v1/object/public/deacons_school_rituals_files/Level%207%20Rituals.pdf?t=2024-07-24T20%3A20%3A30.002Z" }
        ],
        note: "🪑 Your main role is sitting with the kids. Prepare the ritual lesson review game (link below - read ONLY pages 4 & 5) in case Abanoub is absent."
      },
      "mark-william": {
        task: "Sit with the kids, take attendance, and prepare First Hoos Lobsh as backup (in case Poula can't make it).",
        classGroup: "7th & 8th",
        lessonLinks: [
          { label: "▶️ Backup: YouTube Video", url: "https://www.youtube.com/watch?v=K5n8nCnREr0" },
          { label: "🌐 Backup: Hymn Page", url: "https://www.stgeorgecocnashville.org/deaconsSchool/hymn?id=145&returnUrl=%2Fcalendar" }
        ],
        note: "🪑 Your main role is sitting with the kids and taking attendance. Prepare First Hoos Lobsh (links below) in case Poula is absent."
      },
      "abanoub-hanna": {
        task: "Ritual Lesson Review Game — Lesson One: Liturgy of the Believers",
        classGroup: "7th & 8th",
        lessonLinks: [
          { label: "📄 Open Lesson PDF", url: "https://oplzcugljytvywvewdkj.supabase.co/storage/v1/object/public/deacons_school_rituals_files/Level%209.pdf?t=2024-08-08T03%3A58%3A51.067Z" }
        ]
      },
      "poula-khalil": {
        task: "First Hoos Lobsh",
        classGroup: "7th & 8th",
        lessonLinks: [
          { label: "▶️ YouTube Video", url: "https://www.youtube.com/watch?v=K5n8nCnREr0" },
          { label: "🌐 Hymn Page", url: "https://www.stgeorgecocnashville.org/deaconsSchool/hymn?id=145&returnUrl=%2Fcalendar" }
        ],
        note: "🎯 Finish the whole hymn — all parts. You have this week to complete it."
      },
      "marsilio-nagi": {
        task: "Sit with the kids and prepare the ritual lesson review game (Lesson One: Liturgy of the Believers) as backup (in case Abanoub can't make it).",
        classGroup: "7th & 8th",
        lessonLinks: [
          { label: "📄 Backup: Open Lesson PDF", url: "https://oplzcugljytvywvewdkj.supabase.co/storage/v1/object/public/deacons_school_rituals_files/Level%209.pdf?t=2024-08-08T03%3A58%3A51.067Z" }
        ],
        note: "🪑 Your main role is sitting with the kids. Prepare the ritual lesson review game (link below) in case Abanoub is absent."
      }
      // Add more tasks here as assignments are made:
      // "kerolos-soliman": { task: "...", classGroup: "...", lessonLink: "..." },
    };
    // ============================================

    // Get the servant ID from the URL (e.g. week-aug15.html?servant=jouvany-ghobrial)
    const params = new URLSearchParams(window.location.search);
    const servantId = params.get("servant");
    const app = document.getElementById("app");

    function renderNameList() {
      let html = `
        <header>
          <h1>🛡️ Servants Lesson Plan</h1>
          <div class="task-date">${WEEK_DATE}</div>
          <p class="subtitle">Select your name to view your task</p>
        </header>
      `;

      // 5th & 6th Boys
      html += `<div class="group"><h2>👦 5th &amp; 6th Boys</h2><div class="name-grid">`;
      ["abanoub-nagdy", "kerolos-soliman", "jouvany-ghobrial", "divid-romany"].forEach(id => {
        const s = SERVANTS[id];
        html += `<a href="?servant=${id}" class="name-card">${s.name}</a>`;
      });
      html += `</div></div>`;

      // 7th & 8th
      html += `<div class="group"><h2>👦 7th &amp; 8th</h2><div class="name-grid">`;
      ["marsilio-nagi", "abanoub-hanna", "mark-william", "poula-khalil"].forEach(id => {
        const s = SERVANTS[id];
        html += `<a href="?servant=${id}" class="name-card">${s.name}</a>`;
      });
      html += `</div></div>`;

      html += `<footer><p>For questions, contact your coordinator.</p></footer>`;
      app.innerHTML = html;
    }

    function renderTask(servantId) {
      const servant = SERVANTS[servantId];
      if (!servant) {
        renderNameList();
        return;
      }

      const task = TASKS[servantId];

      let taskHtml;
      if (task) {
        taskHtml = `
          <div class="task-box">
            <div class="task-label">Your Task</div>
            <div class="task-name">${task.task}</div>
            <div class="task-class">Class: ${task.classGroup}</div>
          </div>
          ${task.note ? `
            <div style="margin-top:14px;background:#fffbeb;border-left:4px solid #f6ad55;color:#744210;padding:12px 16px;border-radius:8px;font-size:0.92rem;text-align:left;">
              ${task.note}
            </div>
          ` : ''}
          ${task.lessonLinks && task.lessonLinks.length > 0 ? `
            <div style="margin-top:8px;">
              ${task.lessonLinks.map(function(l) { return `<a href="${l.url}" target="_blank" rel="noopener" class="lesson-link-btn" style="margin:6px 6px 0 0;">${l.label}</a>`; }).join('')}
            </div>
          ` : ''}
          ${task.lessonLink ? `
            <a href="${task.lessonLink}" target="_blank" rel="noopener" class="lesson-link-btn">
              📖 Open Lesson Materials
            </a>
          ` : ''}
        `;
      } else {
        taskHtml = `
          <div class="no-task">
            No task has been assigned to you for this week yet. 🙏
          </div>
        `;
      }

      app.innerHTML = `
        <div class="task-view">
          <div class="task-date">${WEEK_DATE}</div>
          <div class="servant-name-display">${servant.name}</div>
          <div class="servant-group-label">${servant.group}</div>
          ${taskHtml}
          <br>
          <a href="index.html" class="back-link">&larr; Back to all weeks</a>
        </div>
      `;
    }

    // Render the appropriate view
    if (servantId && SERVANTS[servantId]) {
      renderTask(servantId);
    } else {
      renderNameList();
    }
  </script>
</body>
</html>
